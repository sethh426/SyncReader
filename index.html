<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1c1b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Quiet Reader</title><style>
:root{--bg:#faf8f4;--ink:#1c1b19;--muted:#8a8578;--line:#e4dfd3;--green:#6b7f6e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}main{min-height:100vh;max-width:650px;margin:auto;padding:40px 20px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}h1,h2{font-family:Georgia,serif}.head,.bar,.controls{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 13px;cursor:pointer}.primary{background:var(--ink);color:var(--bg);border:0}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px;margin:8px 0;cursor:pointer}.title{font:600 17px Georgia,serif}.meta{font-size:12px;color:var(--muted);margin-top:3px}.upload{border:2px dashed #d8d2c2;border-radius:10px;padding:50px 20px;text-align:center;cursor:pointer}.tabs{display:flex;background:#f1f0e8;padding:4px;border-radius:8px;margin:20px 0}.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:6px}.tabs .on{background:var(--bg);font-weight:600}.field,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;padding:10px;margin-bottom:10px}.reader{font:19px/1.85 Georgia,serif;margin-top:25px}.sent{cursor:pointer}.past{opacity:.45}.word{padding:1px 2px;border-radius:3px}.active{background:var(--green);color:white;font-weight:bold}.heading{display:block;font-weight:600}.h1{font-size:27px}.h2{font-size:23px}.controls{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}.circle{border:1px solid var(--line);background:var(--bg);border-radius:50%;width:38px;height:38px}.play{background:var(--ink);color:white;width:46px;height:46px}.grow{flex:1}.error{background:#fbefe8;border:1px solid #e2a57c;color:#8a4a1e;padding:10px;border-radius:6px;margin:12px 0}.q{background:#fff;border:1px solid var(--line);border-radius:9px;padding:17px;margin:12px 0}.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:6px;margin:7px 0;cursor:pointer}.sel{background:#f1f0e8}.correct{background:#eef3ee;border-color:var(--green)}.wrong{background:#fbefe8;border-color:#e2a57c}@media(max-width:600px){main{padding:22px 14px;padding-bottom:calc(28px + env(safe-area-inset-bottom))}.reader{font-size:19px;line-height:1.9}.btn{min-height:42px;padding:9px 14px}.circle{width:44px;height:44px}.play{width:52px;height:52px}.controls{position:sticky;bottom:0;background:rgba(250,248,244,.97);margin-left:-14px;margin-right:-14px;padding:14px;border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom));z-index:3}.upload{padding:42px 16px}.field,textarea{font-size:16px}.card{padding:16px}.tabs button{min-height:42px}}
</style></head><body><div id="app"></div><script>
const KEY='quiet-reader-docs-v2';let screen='library',doc=null,idx=0,playing=false,char=-1,rate=1,auto=true,tab='upload',answers={},submitted=false;
const sample=[['heading',1,['How Memory Consolidation Works']],['paragraph',0,['Every time you learn something new, your brain briefly holds it in a fragile, easily disrupted state.','This early stage is called working memory, and it can hold only a handful of items at once.','Without further processing, most of what enters working memory decays within seconds.']],['paragraph',0,['Consolidation is the process that transforms this fragile trace into a more durable memory.','It relies heavily on the hippocampus, a small seahorse-shaped structure deep in the brain.','During sleep, the hippocampus replays the day’s experiences, gradually transferring them to the cortex for long-term storage.']],['paragraph',0,['One technique that strengthens this process is retrieval practice: actively recalling information rather than simply re-reading it.','Each act of retrieval reactivates and re-stabilizes the memory trace, making it more resistant to forgetting.','This is why testing yourself is consistently more effective than passive review.']]];
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function sentences(t){return (t.replace(/\s+/g,' ').trim().match(/[^.!?]+[.!?]+(?:\s+|$)|[^.!?]+$/g)||[]).map(x=>x.trim())}function blocks(raw,md){if(md){let out=[],buf=[];const flush=()=>{if(buf.length){let s=sentences(buf.join(' '));if(s.length)out.push(['paragraph',0,s]);buf=[]}};for(const line of raw.replace(/\r/g,'').split('\n')){let h=line.match(/^(#{1,6})\s+(.*)$/),l=line.match(/^\s*[-*+]\s+(.*)$/);if(h){flush();out.push(['heading',h[1].length,[h[2].trim()]])}else if(l){flush();out.push(['list',0,sentences(l[1])])}else if(!line.trim())flush();else buf.push(line.trim())}flush();return out}return raw.trim().split(/\n\s*\n|\n/).map(x=>['paragraph',0,sentences(x)]).filter(x=>x[2].length)}function make(raw,name,md,title){let b=blocks(raw,md);let ss=[];b.forEach((x,bi)=>x[2].forEach((t,si)=>ss.push({id:bi+'-'+si,bi,type:x[0],level:x[1],text:t,words:t.split(/(\s+)/).filter(Boolean)})));return {id:null,title:title||((b.find(x=>x[0]=='heading')||[])[2]?.[0]||name.replace(/\.(txt|md|markdown)$/i,'')),fileName:name,blocks:b,sentences:ss,quiz:null}}
function docs(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(d){let a=docs(),id=d.id||'doc_'+Date.now();d={...d,id,savedAt:Date.now()};localStorage.setItem(KEY,JSON.stringify([d,...a.filter(x=>x.id!==id)]));return d}function remove(id){localStorage.setItem(KEY,JSON.stringify(docs().filter(x=>x.id!==id)))}
function render(){document.getElementById('app').innerHTML=screen==='library'?library():screen==='upload'?upload():screen==='quiz'?quiz():reader();bind()}
function library(){let a=docs().sort((x,y)=>(y.savedAt||0)-(x.savedAt||0));return `<main><div class=head><h1>Your library</h1><button class="btn primary" data-a=new>+ New document</button></div>${a.length?a.map(d=>`<div class=card data-open="${esc(d.id)}"><div class=title>${esc(d.title)}</div><div class=meta>${d.sentences.length} sentences${d.quiz?.length?' · quiz ready':''} · ${new Date(d.savedAt).toLocaleDateString()}</div><button class=btn data-del="${esc(d.id)}" style="float:right;margin-top:-32px">×</button></div>`).join(''):`<div class=card style="text-align:center;color:var(--muted);cursor:default;padding:40px">No saved documents yet. Add one to get started.</div>`}</main>`}
function upload(){return `<main><h1 style=text-align:center>Bring a document to read</h1><p class=muted style=text-align:center;line-height:1.6>Everything in this version stays in your browser. No account, server, or API key.</p><div class=tabs><button class="${tab==='upload'?'on':''}" data-tab=upload>Upload file</button><button class="${tab==='paste'?'on':''}" data-tab=paste>Paste text</button></div>${tab==='upload'?`<div class=upload id=drop>↥<br><br>Drop a .txt or .md file here, or click to browse<br><small class=muted>Nothing is uploaded anywhere.</small><input id=file type=file accept=".txt,.md,.markdown" hidden></div>`:`<input id=title class=field placeholder="Title (optional)"><textarea id=paste rows=12 placeholder="Paste your document text here…"></textarea><label class=muted><input id=md type=checkbox> Markdown formatting</label><button class="btn primary" data-a=read style=float:right>Read this</button>`}<div id=err></div><button class=btn data-a=sample style="display:block;margin:20px auto">Or try the sample document</button><button class=btn data-a=library style="display:block;margin:auto">Back to library</button></main>`}
function reader(){let s=doc.sentences;return `<main><div class=bar><button class=btn data-a=library>× close</button><span class=muted>Sentence ${idx+1} of ${s.length}</span></div><div class=bar style="margin-top:12px"><span class=muted>${esc(doc.fileName)}</span><span><button class=btn data-a=save>Save to library</button> <button class=btn data-a=quiz>Quiz</button></span></div><div id=tts></div><div class=reader>${s.map((x,i)=>sent(x,i)).join('')}</div><div class=controls><button class=circle data-a=prev>‹</button><button class="circle play" data-a=play>${playing?'❚❚':'▶'}</button><button class=circle data-a=next>›</button><button class=circle data-a=replay>↻</button><div class=grow></div><label class=muted>Speed <select id=rate><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select>x</label><label class=muted><input id=auto type=checkbox checked> auto</label></div></main>`}
function sent(x,i){let p=0;return `<span class="sent ${x.type==='heading'?'heading h'+Math.min(x.level||1,2):''} ${i<idx?'past':''}" data-s="${i}">${x.words.map(w=>{let st=p;p+=w.length;if(/^\s+$/.test(w))return esc(w);let ac=i===idx&&char>=st&&char<st+w.length;return `<span class="word ${ac?'active':''}">${esc(w)}</span>`}).join('')}</span>${x.type==='heading'?'<div style="height:18px"></div>':' '}`}
function readerOnly(){let r=document.querySelector('.reader');if(r)r.innerHTML=doc.sentences.map((x,i)=>sent(x,i)).join('')}
function speak(){if(!speechSynthesis){document.getElementById('tts').innerHTML='<div class=error>Speech synthesis is not supported by this browser.</div>';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(doc.sentences[idx].text);u.rate=rate;playing=true;char=-1;u.onboundary=e=>{if(typeof e.charIndex==='number'){char=e.charIndex;readerOnly()}};u.onend=()=>{char=-1;if(auto&&idx<doc.sentences.length-1){idx++;speak()}else{playing=false;render()}};u.onerror=e=>{playing=false;document.getElementById('tts').innerHTML='<div class=error>Speech failed: '+esc(e.error||'unknown error')+'</div>';render()};speechSynthesis.speak(u);render()}
function stop(){speechSynthesis?.cancel();playing=false;char=-1}
function genQuiz(){let ss=doc.sentences.filter(x=>x.type!=='heading'&&x.text.length>40),out=[];for(let x of ss.slice(0,5)){let words=x.text.split(/\s+/), answer=words[Math.max(1,Math.floor(words.length/3))].replace(/[^A-Za-z-]/g,'');if(answer.length<3)continue;let q=x.text.replace(answer,'_____'),opts=[answer,'working memory','hippocampus','retrieval practice'].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4);while(opts.length<4)opts.push('the cortex');opts=opts.sort(()=>Math.random()-.5);out.push({question:'According to the document, which option completes the statement? '+q,options:opts,correctIndex:opts.indexOf(answer),explanation:'The answer comes directly from the source sentence.'})}return out}
function quiz(){let q=doc.quiz||[];let score=q.reduce((n,x,i)=>n+(answers[i]===x.correctIndex?1:0),0);return `<main><div class=bar><button class=btn data-a=back>‹ back to reading</button>${submitted?`<b>${score} / ${q.length} correct</b>`:''}</div><h2>Quiz: ${esc(doc.title)}</h2><p class=muted>Generated locally. No AI service or network request is used.</p>${q.map((x,i)=>`<div class=q><b>${i+1}. ${esc(x.question)}</b>${x.options.map((o,j)=>`<button class="opt ${answers[i]===j&&!submitted?'sel':''} ${submitted&&j===x.correctIndex?'correct':''} ${submitted&&answers[i]===j&&j!==x.correctIndex?'wrong':''}" data-q="${i}" data-o="${j}" ${submitted?'disabled':''}>${esc(o)}</button>`).join('')}${submitted?`<p class=muted>${answers[i]===x.correctIndex?'Correct. ':'Not quite. '}${esc(x.explanation)}</p>`:''}</div>`).join('')}<button class="btn primary" data-a=${submitted?'retake':'submit'}>${submitted?'Retake quiz':'Submit answers'}</button> <button class=btn data-a=newquiz>New questions</button></main>`}
function bind(){document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{doc=docs().find(x=>x.id===e.dataset.open);idx=0;screen='reading';render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();remove(b.dataset.del);render()});document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>{idx=+e.dataset.s;char=-1;playing?speak():render()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.o;render()});let f=document.getElementById('file');if(f){f.onchange=()=>readFile(f.files[0]);let d=document.getElementById('drop');d.onclick=()=>f.click();d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();readFile(e.dataTransfer.files[0])}}let rs=document.getElementById('rate');if(rs)rs.onchange=()=>{rate=+rs.value;if(playing)speak()};let au=document.getElementById('auto');if(au)au.onchange=()=>auto=au.checked}
function readFile(f){if(!f||!/\.(txt|md|markdown)$/i.test(f.name)){document.getElementById('err').innerHTML='<div class=error>Please choose a .txt, .md, or .markdown file.</div>';return}let r=new FileReader();r.onload=()=>{try{doc=make(String(r.result),f.name,/\.(md|markdown)$/i.test(f.name));idx=0;screen='reading';render()}catch(e){document.getElementById('err').innerHTML='<div class=error>'+esc(e.message)+'</div>'}};r.readAsText(f)}
function act(a){if(a==='new'){screen='upload';tab='upload';render()}else if(a==='library'){stop();screen='library';render()}else if(a==='sample'){doc=make(sample.map(x=>x[2].join(' ')).join('\n\n'),'sample.md');doc.title='How Memory Consolidation Works';doc.blocks=sample;doc.sentences=[];sample.forEach((x,bi)=>x[2].forEach((t,si)=>doc.sentences.push({id:bi+'-'+si,bi,type:x[0],level:x[1],text:t,words:t.split(/(\s+)/).filter(Boolean)})));idx=0;screen='reading';render()}else if(a==='read'){try{doc=make(document.getElementById('paste').value,'Pasted text',document.getElementById('md').checked,document.getElementById('title').value);idx=0;screen='reading';render()}catch(e){document.getElementById('err').innerHTML='<div class=error>'+esc(e.message)+'</div>'}}else if(a==='save'){doc=save(doc);render()}else if(a==='prev'){stop();idx=Math.max(0,idx-1);render()}else if(a==='next'){stop();idx=Math.min(doc.sentences.length-1,idx+1);render()}else if(a==='play'){playing?speak():(speak())}else if(a==='replay'){speak()}else if(a==='quiz'){if(!doc.quiz?.length)doc.quiz=genQuiz();answers={};submitted=false;screen='quiz';render()}else if(a==='back'){screen='reading';render()}else if(a==='submit'){if(doc.quiz.every((_,i)=>answers[i]!==undefined)){submitted=true;render()}}else if(a==='retake'){answers={};submitted=false;render()}else if(a==='newquiz'){doc.quiz=genQuiz();answers={};submitted=false;render()}}
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script></body></html>
